[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplexpo-portable"
version = "0.1.0"
description = "Framework-neutral data construction and event-level GRPO for full-duplex conversational models"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Yuxin Li"},
  {name = "Donghang Wu"},
  {name = "Guan-Ting Lin"},
  {name = "Hung-yi Lee"},
  {name = "Chengwei Qin"},
  {name = "Zhehuai Chen"},
  {name = "Chen Chen"},
]
urls = {Paper = "https://arxiv.org/abs/2607.07148"}
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
duplexpo = "duplexpo_portable.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duplexpo_portable = ["recipes/*.json", "schemas/*.json"]
